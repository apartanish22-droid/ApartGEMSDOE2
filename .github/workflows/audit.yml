name: Reproducible evidence audit

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch hash-pinned public research inputs and read-only tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/fetch_audit_data.py
          python scripts/restore_shared_tools.py
      - name: Replay forensic and diagnostic tests
        run: |
          pytest -q
          node --test tests/js/source_freshness.test.cjs
      - name: Verify generated site briefs are current
        run: |
          python scripts/build_site.py
          python scripts/build_scorecard.py
          git diff --exit-code -- docs/index.html docs/executive-summary.html docs/research.html docs/sites docs/forensics docs/data/run_card.json
